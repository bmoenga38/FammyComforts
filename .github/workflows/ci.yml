name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `next build` inlines NEXT_PUBLIC_* at build time, and the module-scope
# `new ConvexReactClient(...)` in convex-client-provider.tsx throws on an
# undefined address — so without a value here `pnpm build` dies while
# prerendering the root layout, in BOTH jobs. CI has no Convex deployment of its
# own, and this placeholder deliberately does not resolve: it keeps the e2e specs
# honest (they assert boot/render/hydrate, never data — see e2e/smoke.spec.ts)
# and guarantees CI can never read from or write to a real deployment.
env:
  NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm is pinned via the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # postinstall runs `prisma generate` (no DB needed — Prisma 7 driver adapter).
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Playwright e2e (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium)
        run: pnpm --filter @fammycomforts/web exec playwright install --with-deps chromium

      # Build once; the Playwright webServer serves this build via `next start`.
      # Use Turbo so workspace deps (shared) build first per `^build` — a direct
      # `pnpm --filter web build` skips them and fails to resolve `@fammycomforts/shared`.
      - name: Build web (+ workspace deps)
        run: pnpm exec turbo run build --filter=@fammycomforts/web

      - name: Run e2e
        run: pnpm --filter @fammycomforts/web test:e2e
